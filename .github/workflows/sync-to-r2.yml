name: Sync Binaries to R2 CDN

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      template:
        description: 'Template name to sync (e.g., gongwen)'
        required: true
        type: string
      version:
        description: 'Template version to sync (e.g., 1.2.1 or v1.2.1)'
        required: true
        type: string
      tag:
        description: 'Release tag to download (optional, e.g., gongwen-v1.2.1)'
        required: false
        type: string
      channel:
        description: 'Registry channel: production or prerelease'
        required: false
        type: choice
        default: production
        options:
          - production
          - prerelease

jobs:
  sync-to-r2:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Parse template release
        id: release
        shell: bash
        env:
          PAYLOAD_TEMPLATE: ${{ github.event.client_payload.template || inputs.template }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version || inputs.version }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          PAYLOAD_CHANNEL: ${{ github.event.client_payload.channel || inputs.channel || 'production' }}
        run: |
          TEMPLATE="${PAYLOAD_TEMPLATE}"
          VERSION="${PAYLOAD_VERSION#v}"
          TAG="${PAYLOAD_TAG}"
          CHANNEL="${PAYLOAD_CHANNEL}"
          if [ -z "${TAG}" ]; then
            TAG="${TEMPLATE}-v${VERSION}"
          fi

          if [[ ! "${TEMPLATE}" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "Invalid template name: ${TEMPLATE}" >&2
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid template version: ${VERSION}" >&2
            exit 1
          fi
          case "${CHANNEL}" in
            production)
              REGISTRY_DIR="templates"
              R2_PREFIX="templates/binaries"
              ;;
            prerelease)
              REGISTRY_DIR="templates-prerelease"
              R2_PREFIX="templates-prerelease/binaries"
              ;;
            *)
              echo "Invalid registry channel: ${CHANNEL}" >&2
              exit 1
              ;;
          esac

          {
            echo "template=${TEMPLATE}"
            echo "version=${VERSION}"
            echo "version_path=v${VERSION}"
            echo "tag=${TAG}"
            echo "channel=${CHANNEL}"
            echo "registry_dir=${REGISTRY_DIR}"
            echo "r2_prefix=${R2_PREFIX}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout registry-deploy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get install -y jq curl

      - name: Setup Cloudflare R2 CLI
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          sudo mv rclone-*-linux-amd64/rclone /usr/local/bin/
          sudo chmod +x /usr/local/bin/rclone
          rm -rf rclone-*

          mkdir -p ~/.config/rclone
          sed 's/^          //' > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = public-read
          no_check_bucket = true
          EOF

      - name: Download binaries from GitHub Release
        env:
          TEMPLATE: ${{ steps.release.outputs.template }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_REPO: ${{ secrets.SOURCE_REPO || 'Presto-io/presto-official-templates' }}
        run: |
          set -euo pipefail

          echo "Downloading ${TEMPLATE} binaries from release ${RELEASE_TAG}"
          RELEASE_URL="https://api.github.com/repos/${SOURCE_REPO}/releases/tags/${RELEASE_TAG}"
          MAX_ATTEMPTS=6

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            rm -rf /tmp/binaries
            mkdir -p /tmp/binaries

            if curl -fsSL "${RELEASE_URL}" -o /tmp/release.json; then
              jq -r --arg prefix "presto-template-${TEMPLATE}-" \
                '.assets[] | select(.name | startswith($prefix)) | .browser_download_url' \
                /tmp/release.json > /tmp/binary-urls.txt

              while read -r url; do
                [ -n "${url}" ] || continue
                filename="$(basename "${url}")"
                echo "Downloading ${filename}"
                curl -fL -o "/tmp/binaries/${filename}" "${url}"
              done < /tmp/binary-urls.txt
            fi

            count="$(find /tmp/binaries -type f | wc -l | tr -d ' ')"
            if [ "${count}" -gt 0 ]; then
              echo "Downloaded ${count} binaries"
              break
            fi

            if [ "${attempt}" -eq "${MAX_ATTEMPTS}" ]; then
              echo "No binaries found for ${TEMPLATE} in ${RELEASE_TAG} after ${MAX_ATTEMPTS} attempts" >&2
              exit 1
            fi

            echo "Release assets are not available yet (attempt ${attempt}/${MAX_ATTEMPTS}); retrying in 15 seconds"
            sleep 15
          done

      - name: Upload binaries to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'presto-cdn' }}
          TEMPLATE: ${{ steps.release.outputs.template }}
          VERSION_PATH: ${{ steps.release.outputs.version_path }}
          R2_PREFIX: ${{ steps.release.outputs.r2_prefix }}
        run: |
          echo "Uploading ${TEMPLATE} binaries to R2 bucket: ${R2_BUCKET}"
          ls -lh /tmp/binaries/

          for binary in /tmp/binaries/*; do
            filename="$(basename "$binary")"
            prefix="presto-template-${TEMPLATE}-"
            platform="${filename#"$prefix"}"
            platform="${platform%.exe}"
            r2_path="r2:${R2_BUCKET}/${R2_PREFIX}/${VERSION_PATH}/${TEMPLATE}/${platform}"

            echo "Uploading ${filename} -> ${r2_path}"
            rclone copyto "$binary" "$r2_path" --progress
          done

      - name: Update registry.json with CDN URLs
        env:
          CDN_DOMAIN: ${{ secrets.CDN_DOMAIN || 'cdn.presto.c-1o.top' }}
          TEMPLATE: ${{ steps.release.outputs.template }}
          VERSION_PATH: ${{ steps.release.outputs.version_path }}
          REGISTRY_DIR: ${{ steps.release.outputs.registry_dir }}
          R2_PREFIX: ${{ steps.release.outputs.r2_prefix }}
        run: |
          echo "Updating CDN URLs for ${TEMPLATE}"
          cd "${REGISTRY_DIR}"
          cp registry.json registry.json.backup
          git show "HEAD^:${REGISTRY_DIR}/registry.json" > registry.previous.json 2>/dev/null || cp registry.json registry.previous.json

          jq --arg template "$TEMPLATE" --arg version "$VERSION_PATH" --arg domain "$CDN_DOMAIN" --arg prefix "$R2_PREFIX" --slurpfile previous registry.previous.json '
            ($previous[0].templates // []) as $old_templates |
            .templates |= map(
              if .name == $template then
                .platforms |= (
                  to_entries | map(
                    .value.cdn_url = "https://" + $domain + "/" + $prefix + "/" + $version + "/" + $template + "/" + .key
                  ) | from_entries
                )
              else
                .name as $name |
                (first($old_templates[]? | select(.name == $name) | .platforms) // null) as $old_platforms |
                if $old_platforms then
                  .platforms |= (
                    to_entries | map(
                      .key as $platform |
                      if ($old_platforms[$platform].cdn_url // "") != "" then
                        .value.cdn_url = $old_platforms[$platform].cdn_url
                      else
                        .
                      end
                    ) | from_entries
                  )
                else
                  .
                end
              end
            )
          ' registry.json.backup > registry.json.new

          mv registry.json.new registry.json
          rm registry.json.backup registry.previous.json

      - name: Verify CDN URLs
        env:
          TEMPLATE: ${{ steps.release.outputs.template }}
          REGISTRY_DIR: ${{ steps.release.outputs.registry_dir }}
        run: |
          echo "Verifying CDN URLs for ${TEMPLATE}"
          cd "${REGISTRY_DIR}"

          jq -r --arg template "$TEMPLATE" '
            .templates[] | select(.name == $template) | .platforms
            | to_entries[]
            | [.key, .value.cdn_url, .value.sha256] | @tsv
          ' registry.json \
            | while IFS=$'\t' read -r platform url expected_sha; do
                echo "Testing: ${platform} ${url}"
                tmp_file="$(mktemp)"
                if ! curl -fsSL "$url" -o "$tmp_file"; then
                  echo "  FAILED: download failed"
                  echo "$url" >> /tmp/failed_urls.txt
                  rm -f "$tmp_file"
                  continue
                fi

                actual_sha="$(sha256sum "$tmp_file" | awk '{print $1}')"
                rm -f "$tmp_file"
                if [ "$actual_sha" = "$expected_sha" ]; then
                  echo "  OK sha256=${actual_sha}"
                else
                  echo "  FAILED: expected ${expected_sha}, got ${actual_sha}"
                  echo "$url" >> /tmp/failed_urls.txt
                fi
              done

          if [ -f /tmp/failed_urls.txt ]; then
            cat /tmp/failed_urls.txt
            exit 1
          fi

      - name: Commit and push changes
        env:
          CI_GPG_KEY_ID: ${{ vars.CI_GPG_KEY_ID }}
          CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
          CI_GPG_PRIVATE_KEY: ${{ secrets.CI_GPG_PRIVATE_KEY }}
          CI_GIT_USER_EMAIL: ${{ vars.CI_GIT_USER_EMAIL }}
          CI_GIT_USER_NAME: ${{ vars.CI_GIT_USER_NAME }}
          TEMPLATE: ${{ steps.release.outputs.template }}
          VERSION: ${{ steps.release.outputs.version }}
          REGISTRY_DIR: ${{ steps.release.outputs.registry_dir }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          git add "${REGISTRY_DIR}/registry.json"
          if ! git diff --cached --quiet; then
            bash scripts/ci/setup-git-signing.sh
            git commit -m "chore: sync ${CHANNEL} ${TEMPLATE} binaries to R2 for v${VERSION}"
          fi
          git push

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/binaries
          rm -f /tmp/failed_urls.txt
